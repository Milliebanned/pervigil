name: pervigil
on:
  schedule:
    - cron: "7 * * * *"   # hourly; the agent itself decides whether a decision is due
  workflow_dispatch:
permissions:
  contents: write
concurrency: pervigil
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One live cycle
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -m pervigil.live
      - name: Rebuild the public page
        run: python -m pervigil.site
      - name: Commit log
        run: |
          git config user.name "pervigil"
          git config user.email "pervigil@users.noreply.github.com"
          git add data/candles data/earnings.json state logs docs results/scorecard.json
          git diff --cached --quiet || git commit -m "pervigil: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
